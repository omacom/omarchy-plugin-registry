# Kamal deployment — companion to docs/deploy.md, which explains every
# REGISTRY_* variable and the data-plane layout.
#
# Current target: staging at omarchy-plugins.ryanhughes.me. Public traffic
# enters through the Cloudflare Tunnel (cloudflared accessory); kamal-proxy
# serves plain HTTP on the docker network — the tunnel is the encrypted
# transport, so no origin certificate exists to renew. Deploys reach the host
# over Tailscale SSH (the bare `omarchy-plugins` name).
# Production cutover to plugins.omarchy.org = swap proxy.host, REGISTRY_* env,
# and the tunnel's public hostname.
service: omarchy-plugin-registry

image: registry/omarchy-plugin-registry

servers:
  web:
    - omarchy-plugins
  # Solid Queue — review pipeline, hold-window releases, index regeneration.
  # Required: without it publishes never process and the data plane never
  # regenerates (docs/deploy.md "Pieces" #2).
  job:
    hosts:
      - omarchy-plugins
    cmd: bin/jobs

proxy:
  host: omarchy-plugins.ryanhughes.me
  # No TLS at the proxy: the only ingress is the Cloudflare Tunnel, which is
  # encrypted end-to-end and connects to kamal-proxy over the private docker
  # network (config.assume_ssl keeps Rails treating requests as https).
  ssl: false
  # Thruster listens on 80 inside the container.
  app_port: 80
  healthcheck:
    path: /up

# Self-hosted image registry on the VM (registry:2, htpasswd auth) — internal
# deploy plumbing, never user-facing. This is the LAST tailscale-FQDN usage:
# its TLS cert is minted for this name (renew ~90 days: `tailscale cert` on
# the VM, copy to /opt/registry/certs, `docker restart registry`). Swap to
# ghcr.io/omacom-io/omarchy-plugin-registry when an org PAT with
# write:packages exists.
registry:
  server: omarchy-plugins.manatee-piranha.ts.net:5443
  username: kamal
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  # Plain docker driver: pushes run through the host daemon, which resolves
  # Tailscale MagicDNS names (the default containerized buildkit does not).
  driver: docker

env:
  clear:
    REGISTRY_BASE_URL: https://omarchy-plugins.ryanhughes.me
    REGISTRY_HOST: omarchy-plugins.ryanhughes.me
    # Witness on its own volume so an app-volume restore can't silently roll
    # back the signed kill list — see docs/deploy.md.
    REGISTRY_WITNESS_PATH: /witness/kill_list_generation
    # Mailpit accessory, reached over the private docker network: login codes
    # land in the web UI at http://omarchy-plugins:8025 instead of a real
    # mailbox. STARTTLS is off for this in-host hop only — a real SMTP
    # provider at launch drops SMTP_STARTTLS and gets verified TLS again.
    SMTP_ADDRESS: omarchy-plugin-registry-mailpit
    SMTP_PORT: "1025"
    SMTP_STARTTLS: "0"
    # AI review (escalate-only, via RubyLLM). The adapter ships in the image;
    # its API key lives OUTSIDE the app env (AiReview scrubs env) via the
    # /opt/registry-ai bind mount: /ai/openai_key (preferred) or
    # /ai/anthropic_key, optional /ai/model override. Enable by writing a key
    # file on the host, then uncommenting — with the command set but no key,
    # every publish is flagged into quarantine (fail closed).
    # Staging: reviews run on the local vLLM at barracuda (Qwen 3.8 27B),
    # configured via /ai/base_url + /ai/model + /ai/effort. Swap for a hosted
    # key file (openai_key/anthropic_key) at launch.
    AI_REVIEW_COMMAND: /rails/script/ai_review_adapter
    # My Omarchy shares this host on staging (the hub answers at /my). For
    # production add my.omarchy.org to the tunnel + proxy.host and set
    # MY_OMARCHY_BASE_URL/MY_OMARCHY_HOST, SESSION_COOKIE_DOMAIN and
    # PASSKEY_RP_ID (docs/deploy.md). Voice keys switch on when the
    # management key file exists under the /ai mount.
    MY_OMARCHY_BASE_URL: https://omarchy-plugins.ryanhughes.me
    MY_OMARCHY_HOST: omarchy-plugins.ryanhughes.me
    OPENROUTER_MANAGEMENT_KEY_FILE: /ai/openrouter_management_key
    # Cloudflare R2 for Active Storage originals (tarball uploads survive
    # loss of the app volume). Credentials in .kamal/local/r2_*.
    R2_BUCKET: omarchy-plugins
  secret:
    - RAILS_MASTER_KEY
    - REGISTRY_SIGNING_SEED
    - R2_ACCESS_KEY_ID
    - R2_SECRET_ACCESS_KEY

volumes:
  # SQLite databases, Active Storage blobs, and the data plane all live under
  # /rails/storage — losing this volume loses accounts, audit, and revocations.
  - "omarchy_registry_storage:/rails/storage"
  - "omarchy_registry_witness:/witness"
  # AI review adapter credentials (read-only; see AI_REVIEW_COMMAND above).
  - "/opt/registry-ai:/ai:ro"

accessories:
  # Cloudflare Tunnel: the ONLY public ingress, for omarchy-plugins.ryanhughes.me.
  # Remotely managed (ingress config lives in Cloudflare, tunnel id
  # 3fe84e30-e646-43e0-8352-4e1bb474b152): edge -> this container ->
  # http://kamal-proxy:80 over the private docker network. Token in
  # .kamal/local/tunnel_token.
  cloudflared:
    image: cloudflare/cloudflared:latest
    host: omarchy-plugins
    cmd: tunnel --no-autoupdate run
    env:
      secret:
        - TUNNEL_TOKEN
  # E2E mail catcher: the app delivers to it by container name on the docker
  # network; web UI published on 8025 (tailnet/LAN only).
  mailpit:
    image: axllent/mailpit:v1.27
    host: omarchy-plugins
    options:
      publish:
        - "8025:8025"

# Bridge assets between versions during deploys so old pages keep resolving
# fingerprinted files.
asset_path: /rails/public/assets

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
