# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  registry_cleanup:
    class: Registry::CleanupJob
    schedule: every hour at minute 27
  # Reconciliation: if a post-takedown regen enqueue was ever lost, the signed
  # index and kill list converge with the database within minutes.
  data_plane_reconcile:
    class: DataPlane::RegenerateJob
    schedule: every 10 minutes
  compatibility_alerts:
    class: CompatibilityAlertsJob
    schedule: every 10 minutes
  repo_stats_sweep:
    class: Registry::RepoStatsSweepJob
    schedule: at 4am every day
